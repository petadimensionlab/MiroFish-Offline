services:
  mirofish:
    build: .
    # Or use pre-built image (when available):
    # image: ghcr.io/nikmcfly/mirofish-offline:latest
    container_name: mirofish-offline
    env_file:
      - .env
    environment:
      # Inside the compose network, reach bundled services by name. These
      # override the host-oriented values in .env so full-Docker mode works
      # without editing .env.
      - NEO4J_URI=bolt://neo4j:7687
      - LLM_BASE_URL=http://ollama:11434/v1
      - OPENAI_API_BASE_URL=http://ollama:11434/v1
      - EMBEDDING_BASE_URL=http://ollama:11434
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  neo4j:
    image: neo4j:5.18-community
    container_name: mirofish-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: mirofish-ollama
    ports:
      - "11434:11434"
    environment:
      # --- Concurrency / performance ---------------------------------------
      # Ollama DOES support parallel inference, but OLLAMA_NUM_PARALLEL
      # defaults to 1, which serializes requests. Raising it lets the OASIS
      # simulation's ~30 concurrent agent calls actually run in parallel
      # instead of queueing one by one.
      #
      # IMPORTANT: effective context per model = OLLAMA_CONTEXT_LENGTH *
      # OLLAMA_NUM_PARALLEL, and KV-cache memory scales linearly with that
      # product. On Apple Silicon (unified memory) the KV cache competes with
      # model weights for system RAM, so keep the product within your budget.
      # Use GGUF models (NOT *-mlx tags) for concurrency on Apple Silicon:
      # the MLX engine serializes requests. Some MoE architectures also force
      # parallel=1; check the server log if throughput does not improve.
      #
      # Keep MAX_LOADED_MODELS >= 2: the chat model and the embedding model
      # (nomic-embed-text) must both stay resident, otherwise each switch
      # unloads and reloads the large chat model.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-64}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # Optional — lower KV memory/bandwidth (uncomment to enable):
      # - OLLAMA_FLASH_ATTENTION=1
      # - OLLAMA_KV_CACHE_TYPE=q8_0
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
